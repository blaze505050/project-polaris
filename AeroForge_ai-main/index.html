<html lang="en" class="dark">

    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="AeroForge AI — Project Polaris Engineering Research Environment"
    />

      content="Official engineering research platform of Project Polaris. 40+ numerical solvers, aerodynamics, structural FEA, and orbital mechanics in the browser."
    />

    <!-- Twitter -->

      property="twitter:description"
      content="Official engineering research workstation of Project Polaris."
    />

    <!-- Fonts -->

      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Anti-flash theme init -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("aeroforge-theme") || "system";
          var resolved = t;
          if (t === "system") {
            resolved = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          if (resolved === "light") {
            document.documentElement.classList.add("light");
            document.documentElement.setAttribute("data-theme", "light");
            document.documentElement.style.colorScheme = "light";
          } else {
            document.documentElement.classList.remove("light");
            document.documentElement.setAttribute("data-theme", "dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {}
      })();
    </script>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "AeroForge AI",
        "applicationCategory": "EngineeringApplication",
        "operatingSystem": "Web Browser (Chrome, Firefox, Safari, Edge)",
        "description": "Browser-based computational engineering workstation for aerospace aerodynamics, CFD, structural FEA, and orbital mechanics.",
        "creator": {
          "@type": "Organization",
          "name": "Project Polaris",
          "url": "https://projectpolaris.in/"
        },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body
